services:
  backend:
    build: .
    ports:
      - "3000:8080"
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/coderhouse
      JWT_SECRET: super-secret-dev
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
